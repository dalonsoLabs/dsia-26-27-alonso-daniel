# Adaptación de 2_pruebas_y_despliegue/ejemplos/ci_proyecto_i.yml.
name: proyecto-i-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit and integration tests + coverage gate (60%)
        run: |
          python -m pytest -q \
            --cov=ventas_app \
            --cov=acciones_app \
            --cov-report=term-missing \
            --cov-fail-under=60
