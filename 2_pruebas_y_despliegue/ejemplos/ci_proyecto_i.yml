# Plantilla CI Proyecto I — copiar a .github/workflows/ci.yml
name: proyecto-i-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests + coverage gate (>= 60%)
        run: |
          pytest -q \
            --cov=ventas_app \
            --cov=internet_app \
            --cov-report=term-missing \
            --cov-fail-under=60
